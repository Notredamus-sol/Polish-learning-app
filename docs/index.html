<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2233">
<meta name="description" content="Daily Polish course, A1 to A2. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif;background:#EDF0F4}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Polski Codziennie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a single-column study app. The course map is a tram line with 12 stops, and the daily session runs one step at a time. */
:root {
  --bg: #EDF0F4;
  --surface: #FFFFFF;
  --surface-2: #F5F7FA;
  --ink: #1B2233;
  --muted: #5A6478;
  --line: #D4DAE3;
  --accent: #BF2B38;
  --accent-soft: #F8E3E5;
  --on-accent: #FFFFFF;
  --good: #2A7A57;
  --good-soft: #DFF1E8;
  --warn: #A86A07;
  --warn-soft: #FBEFD6;
  --blue: #2F4E8C;
  --blue-soft: #E1E8F5;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F131B; --surface: #181E2A; --surface-2: #1F2634; --ink: #E7EAF1; --muted: #9AA3B6;
    --line: #2B3444; --accent: #EF5F6B; --accent-soft: #3A1E24; --on-accent: #1A0B0E;
    --good: #5CC497; --good-soft: #17352A; --warn: #E6B04C; --warn-soft: #3A2E15;
    --blue: #8FAAE6; --blue-soft: #1D2A45; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F131B; --surface: #181E2A; --surface-2: #1F2634; --ink: #E7EAF1; --muted: #9AA3B6;
  --line: #2B3444; --accent: #EF5F6B; --accent-soft: #3A1E24; --on-accent: #1A0B0E;
  --good: #5CC497; --good-soft: #17352A; --warn: #E6B04C; --warn-soft: #3A2E15;
  --blue: #8FAAE6; --blue-soft: #1D2A45; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 64px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.pl { font-family: var(--display); font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 22px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.num { font-variant-numeric: tabular-nums; }

/* Top bar */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 8px 14px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(var(--surface) 0 50%, var(--accent) 50% 100%); border: 1.5px solid var(--ink); }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat.streak { color: var(--warn); }
.sync { font-size: 0.75rem; color: var(--muted); align-self: center; }

nav.tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 18px; }
nav.tabs button { border: 0; background: transparent; border-radius: 9px; padding: 7px 4px; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
nav.tabs button .pl { font-size: 0.98rem; }
nav.tabs button .en { font-size: 0.72rem; color: var(--muted); }
nav.tabs button[aria-current="page"] { background: var(--ink); color: var(--bg); }
nav.tabs button[aria-current="page"] .en { color: var(--bg); opacity: 0.75; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.card.flat { background: var(--surface-2); }
.btn { border: 1.5px solid var(--ink); background: var(--surface); border-radius: 10px; padding: 9px 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: var(--line); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; }
.btn[aria-disabled="true"] { pointer-events: none; }
a.btn { text-decoration: none; color: inherit; }
.btn.sm { padding: 5px 11px; font-size: 0.875rem; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 10px; font-size: 0.8rem; font-weight: 700; background: var(--blue-soft); color: var(--blue); }
.chip.red { background: var(--accent-soft); color: var(--accent); }
.chip.green { background: var(--good-soft); color: var(--good); }
.chip.gold { background: var(--warn-soft); color: var(--warn); }

/* Today */
.hello { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
.unit-banner { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.stop-num { width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--accent); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.4rem; color: var(--accent); background: var(--surface); }
.plan { display: flex; flex-direction: column; }
.plan-item { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding-block: 12px; border-top: 1px solid var(--line); }
.plan-item:first-child { border-top: 0; }
.tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 0.8rem; font-weight: 800; color: var(--muted); }
.plan-item.done .tick { background: var(--good); border-color: var(--good); color: var(--surface); }
.plan-item.next .tick { border-color: var(--accent); color: var(--accent); }
.plan-item .title { font-weight: 700; }
.plan-item .desc { font-size: 0.85rem; color: var(--muted); }
.meter { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

/* Session */
.session-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.steps-dots { display: flex; gap: 5px; }
.steps-dots i { width: 22px; height: 6px; border-radius: 3px; background: var(--line); display: block; }
.steps-dots i.on { background: var(--accent); }
.steps-dots i.done { background: var(--good); }

/* Flashcard */
.flash { min-height: 230px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 10px; padding: 26px 18px; position: relative; border-bottom: 5px solid var(--accent); }
.flash .word { font-family: var(--display); font-weight: 800; font-size: clamp(1.8rem, 6vw, 2.6rem); line-height: 1.1; overflow-wrap: anywhere; }
.flash .answer { font-size: 1.25rem; font-weight: 700; }
.flash .note { font-size: 0.9rem; color: var(--muted); max-width: 44ch; }
.flash .tagline { position: absolute; top: 12px; left: 14px; }
.flash .count { position: absolute; top: 12px; right: 14px; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grades .btn { justify-content: center; flex-direction: column; gap: 0; padding: 8px 4px; }
.grades .btn small { font-weight: 400; font-size: 0.72rem; color: var(--muted); }
.g-again { border-color: var(--accent) !important; }
.g-good { border-color: var(--good) !important; }

/* Exercises */
.ex-q { font-size: 1.3rem; font-family: var(--display); font-weight: 700; line-height: 1.35; }
.ex-q .blank { display: inline-block; min-width: 3.2em; border-bottom: 3px solid var(--accent); color: var(--accent); text-align: center; }
.hint { color: var(--muted); font-size: 0.95rem; }
input[type=text], textarea { width: 100%; font: inherit; font-size: 1.1rem; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
textarea { min-height: 120px; resize: vertical; font-size: 1rem; }
.keys { display: flex; gap: 5px; flex-wrap: wrap; }
.keys button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 7px; width: 36px; height: 34px; font-family: var(--display); font-weight: 700; font-size: 1.05rem; }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 14px; font-weight: 700; }
.opt:hover:not([disabled]) { border-color: var(--ink); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--accent); background: var(--accent-soft); }
.opt[disabled] { cursor: default; }
.tray { min-height: 52px; border: 1.5px dashed var(--line); border-radius: 10px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.bank { display: flex; flex-wrap: wrap; gap: 6px; }
.tile { border: 1.5px solid var(--ink); background: var(--surface); border-radius: 8px; padding: 5px 11px; font-family: var(--display); font-weight: 700; font-size: 1.05rem; }
.tile.used { opacity: 0.25; pointer-events: none; }
.feedback { border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.feedback.ok { background: var(--good-soft); color: var(--ink); border: 1px solid var(--good); }
.feedback.almost { background: var(--warn-soft); border: 1px solid var(--warn); }
.feedback.no { background: var(--accent-soft); border: 1px solid var(--accent); }
.feedback strong { font-family: var(--display); }

/* Grammar */
.lesson p + p { margin-top: 10px; }
.lesson ul { margin: 8px 0 0; padding-left: 20px; }
.lesson b { font-family: var(--display); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
td.pl { color: var(--accent); }

/* Exams */
.x-head { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 6px 0; }
.x-timer.red { background: var(--accent-soft); color: var(--accent); }
.x-task h3 { font-family: var(--display); }
.x-item { padding: 8px 0; border-top: 1px solid var(--line); }
.x-opts { display: flex; flex-direction: column; gap: 4px; }
.x-opt { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 8px; cursor: pointer; min-width: 0; }
.x-opt input { margin: 0; }
.x-opt.right { border-color: var(--good); background: var(--good-soft); }
.x-opt.wrong { border-color: var(--accent); background: var(--accent-soft); }
.x-letter { font-weight: 700; color: var(--muted); }
.x-tf-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.x-tf-row .row { flex: none; flex-wrap: nowrap; }
.x-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 4px 14px; }
.x-legend.emoji { grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); font-size: 1.6rem; }
.x-legend.emoji b { font-size: 1rem; }
.x-match { flex-wrap: wrap; }
.x-pic { font-size: 1.8rem; letter-spacing: 2px; }
.x-pic.big { font-size: 3rem; }
.x-sign { border: 2.5px solid var(--ink); border-radius: 6px; padding: 8px 14px; font-weight: 800; align-self: flex-start; }
.x-bank { display: flex; flex-wrap: wrap; gap: 6px; border: 1.5px dashed var(--line); border-radius: 10px; padding: 8px; }
.x-input { max-width: 100%; }
.x-num { width: 5.5em; display: inline-block; margin: 0 4px; }
.x-input.right, .x-num.right { border-color: var(--good); }
.x-input.wrong, .x-num.wrong { border-color: var(--accent); }
.x-area { min-height: 120px; }

/* Serbian comparison box */
.sr-note { border-left: 4px solid var(--warn); background: var(--warn-soft); border-radius: 0 10px 10px 0; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
.sr-note p { margin: 0; }
.sr-note p + p { margin-top: 6px; }

/* Reading texts, gap-fill, forms */
.story p { margin: 0; line-height: 1.6; font-weight: 500; }
.read-doc { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.read-title { font-family: var(--display); font-weight: 800; font-size: 1.05rem; overflow-wrap: anywhere; }
.read-lines p { margin: 0; overflow-wrap: anywhere; }
.read-lines p + p { margin-top: 4px; }
.rd-sms .read-lines { background: var(--surface); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 10px 12px; align-self: flex-start; max-width: 100%; }
.rd-sign .read-lines { display: flex; flex-wrap: wrap; gap: 8px; }
.rd-sign .read-lines p { margin: 0; border: 2px solid var(--ink); border-radius: 6px; padding: 4px 10px; font-weight: 800; letter-spacing: 0.02em; }
.rd-notice, .rd-ad { border-style: dashed; }
.rd-press .read-title, .rd-press .read-lines p { font-family: Georgia, "Times New Roman", serif; font-weight: 400; }
.rd-press .read-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; }
.rd-press .read-lines p:first-child { font-size: 1.25rem; font-weight: 700; }
.read-form { display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr); gap: 4px 14px; margin: 0; }
.read-form dt { color: var(--muted); font-size: 0.85rem; padding-top: 2px; overflow-wrap: anywhere; }
.read-form dd { margin: 0; overflow-wrap: anywhere; }
.read-doc td { white-space: normal; }
.cloze { line-height: 2.4; font-size: 1.05rem; overflow-wrap: anywhere; }
select.gap { font: inherit; font-weight: 700; padding: 1px 4px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; }
select.gap.right { border-color: var(--good); background: var(--good-soft); }
select.gap.wrong { border-color: var(--accent); background: var(--accent-soft); }
.gap-fix { color: var(--good); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.form-row { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

.ctx { display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; margin-top: 22px; }
.ctx-pl { font-size: 1.25rem; line-height: 1.5; overflow-wrap: anywhere; }
.ctx-word { color: var(--accent); }

/* Dialogue & chat */
.dlg { display: flex; flex-direction: column; gap: 10px; }
.line { display: grid; grid-template-columns: 76px 1fr auto; gap: 10px; align-items: start; }
.line .who { font-weight: 700; font-size: 0.85rem; color: var(--muted); padding-top: 3px; overflow-wrap: anywhere; }
.line .txt { min-width: 0; }
.line .en { color: var(--muted); font-size: 0.9rem; }
.line .en.hid { filter: blur(5px); cursor: pointer; user-select: none; }
.say { border: 1px solid var(--line); background: var(--surface-2); border-radius: 50%; width: 32px; height: 32px; display: inline-grid; place-items: center; flex: none; }
.say svg { width: 16px; height: 16px; fill: currentColor; }
.chat { display: flex; flex-direction: column; gap: 10px; max-height: 58vh; overflow-y: auto; padding: 4px 2px; }
.bubble { max-width: 86%; padding: 10px 13px; border-radius: 14px; display: flex; flex-direction: column; gap: 4px; }
.bubble.them { background: var(--surface-2); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
.bubble.me { background: var(--ink); color: var(--bg); align-self: flex-end; border-bottom-right-radius: 4px; }
.bubble .en { font-size: 0.85rem; color: var(--muted); }
.fix { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 0.9rem; align-self: flex-end; max-width: 86%; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; }
.sugg button { border: 1px dashed var(--blue); background: var(--blue-soft); color: var(--blue); border-radius: 999px; padding: 4px 11px; font-size: 0.85rem; text-align: left; }
.thinking { color: var(--muted); font-style: italic; }

/* Course map: tram line */
.line-map { position: relative; display: flex; flex-direction: column; }
.stop { display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; padding-block: 10px; position: relative; }
.stop::before { content: ""; position: absolute; left: 19px; top: 0; bottom: 0; width: 4px; background: var(--line); }
.stop:first-child::before { top: 50%; }
.stop:last-child::before { bottom: 50%; }
.stop.mastered::before { background: var(--good); }
.dot { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--line); background: var(--surface); display: grid; place-items: center; font-weight: 800; font-family: var(--display); position: relative; z-index: 1; font-size: 0.95rem; color: var(--muted); }
.stop.mastered .dot { border-color: var(--good); background: var(--good); color: var(--surface); }
.stop.current .dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
.stop .name { min-width: 0; }
.stop .name .pl { font-size: 1.05rem; }
details.ref { border-top: 1px solid var(--line); }
details.ref summary { cursor: pointer; padding-block: 10px; font-weight: 700; }
.vocab-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 16px; }
.vocab-list div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--line); padding-block: 3px; min-width: 0; }
.vocab-list .pl { overflow-wrap: anywhere; }

/* Progress */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile-stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.tile-stat .v { font-family: var(--display); font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding-top: 6px; border-bottom: 1px solid var(--line); position: relative; }
.bars .b { flex: 1; min-width: 0; background: var(--blue); border-radius: 4px 4px 0 0; position: relative; }
.bars .b.pass { background: var(--good); }
.bars .b span { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font-size: 0.68rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bars .pass-line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--accent); }
.heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-width: 320px; }
.heat i { aspect-ratio: 1; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); display: block; max-width: 100%; }
.heat i.l1 { background: var(--good-soft); border-color: var(--good); }
.heat i.l2 { background: var(--good); border-color: var(--good); }
.heat i.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.hbar { display: grid; grid-template-columns: minmax(0, 1fr) 120px auto; gap: 10px; align-items: center; font-size: 0.9rem; }
.hbar .track { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.hbar .track span { display: block; height: 100%; background: var(--accent); }
.boxes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.boxes div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; }
.boxes b { display: block; font-family: var(--display); font-size: 1.2rem; font-variant-numeric: tabular-nums; }

    html: `<p>Most Polish verbs come in <b>pairs</b>. Both verbs in a pair mean the same thing, but they look at the action differently:</p>

/* For a Serbian-speaking learner: a short comparison with Serbian for every
   unit, false friends, and drills on the mistakes Serbian speakers typically
   make in Polish (formal address, kod vs u/do, nie + genitive, "da" clauses…).
   Serbian is written in Latin script here. Keys are unit ids. */
const SR_NOTES = {
  0: `<p><b>być</b> works like <b>biti</b>, but Polish has only the full forms: <b>jestem, jesteś, jest, jesteśmy, jesteście, są</b> (no short <i>sam, si, je</i>). The verb can open a sentence: <b>Jestem Marko.</b></p>
<p>Formal "you" is the biggest trap. Serbian uses <i>Vi</i> + plural verb; Polish uses <b>pan / pani</b> + the <b>he / she</b> form: <b>Jak się pan ma?</b> (not <i>Jak się pan macie?</i>). <b>Wy</b> is only for several people.</p>`,
  1: `<p>Genders work as in Serbian: consonant = masculine, <b>-a</b> = feminine, <b>-o / -e</b> = neuter, and <b>tata, kolega</b> are masculine as in Serbian. <b>mój / moja / moje</b> = <i>moj / moja / moje</i>.</p>
<p>Watch the neuter adjective: Polish <b>moje nowe auto</b> ends in <b>-e</b>, not <i>-o</i> as in <i>moje novo auto</i>.</p>`,
  21: `<p>Serbian <i>iz</i> + genitive is Polish <b>z</b> + genitive: <i>Ja sam iz Srbije</i> → <b>Jestem z Serbii</b>.</p>
<p>Languages: <i>govorim srpski</i> → <b>mówię po serbsku</b> (po + -sku), but <b>znam serbski</b>, <b>uczę się polskiego</b>. A Serb is <b>Serb / Serbka</b>, and citizenship on forms is <b>obywatelstwo serbskie</b> (<i>državljanstvo</i>).</p>`,
  2: `<p><b>mieć</b> = <i>imati</i>: <b>mam, masz, ma, mamy, macie, mają</b>.</p>
<p>Age: <i>Imam 30 godina</i> → <b>Mam 30 lat</b>. Never <i>godzin</i>: <b>godzina</b> means <b>hour</b>. The 2–4 / 5+ split is the same as <i>godine / godina</i>: <b>dwa lata, pięć lat</b>.</p>`,
  3: `<p>The accusative is used as in Serbian, but the feminine ending is <b>-ę</b>, not <i>-u</i>: <i>kafu</i> → <b>kawę</b>, <i>vodu</i> → <b>wodę</b>.</p>
<p>Masculine people and animals take the genitive form, just like Serbian: <i>vidim brata</i> → <b>widzę brata</b>. To order, say <b>Poproszę…</b> (<i>molim vas…</i>), not <i>Daj mi…</i>.</p>`,
  4: `<p>Endings look different but map neatly: <i>-em / -eš</i> → <b>-ę / -esz</b> (<i>pišem</i> → <b>piszę</b>, <i>pišeš</i> → <b>piszesz</b>), and 3rd plural <i>-u</i> → <b>-ą</b> (<i>pišu</i> → <b>piszą</b>). <b>czytam / czytasz</b> works like <i>čitam / čitaš</i>.</p>`,
  5: `<p>Serbian <i>u</i> + locative is Polish <b>w</b> + locative: <i>u Beogradu</i> → <b>w Belgradzie</b>, <i>u parku</i> → <b>w parku</b>. <b>na</b> is the same: <i>na pošti</i> → <b>na poczcie</b>.</p>
<p>Polish <b>u</b> means "at someone's place", like Serbian <i>kod</i>: <b>u mamy, u lekarza</b>.</p>`,
  6: `<p><b>lubić</b> = <i>voleti</i> (for things you like). The big trap: after a negated verb Polish needs the <b>genitive</b>, where Serbian keeps the accusative: <i>Ne volim kafu</i> → <b>Nie lubię kawy</b>, <i>Nemam vremena</i> stays genitive: <b>Nie mam czasu</b>.</p>`,
  23: `<p>Good news: <b>Nie ma mleka</b> = <i>Nema mleka</i>, and <b>dużo / mało</b> + genitive = <i>mnogo / malo</i> + genitive.</p>
<p>Differences: masculine nouns often take <b>-u</b> (<b>cukru, sera</b>, but <b>chleba</b>), where Serbian always has <i>-a</i>. And Polish <b>u</b> + genitive = <i>kod</i>: <b>u Marka</b> = <i>kod Marka</i>.</p>`,
  7: `<p>Days are close relatives: <b>poniedziałek</b> (<i>ponedeljak</i>), <b>wtorek</b> (<i>utorak</i>), <b>środa</b> (<i>sreda</i>), <b>czwartek</b>, <b>piątek</b>, <b>sobota</b>, <b>niedziela</b> (<i>nedelja</i>). "On Monday" = <b>w poniedziałek</b> (<i>u ponedeljak</i>).</p>
<p>Clock time uses feminine ordinals: <i>u osam</i> → <b>o ósmej</b> (at the eighth [hour]).</p>`,
  24: `<p>Month names have to be learned from scratch: Polish uses old Slavic names (<b>styczeń, luty…</b>), not <i>januar, februar</i>. <b>listopad</b> is November (in Croatian <i>studeni</i>).</p>
<p>The date pattern is the same as Serbian: <i>trećeg maja</i> → <b>trzeciego maja</b>.</p>`,
  8: `<p>Agreement is the same idea as Serbian, but Polish has only one (long) form: <b>dobry, dobra, dobre</b> (no <i>dobar</i>). Neuter ends in <b>-e</b>: <b>nowe mieszkanie</b>, not <i>novo</i>.</p>`,
  22: `<p><b>Jak wygląda?</b> = <i>Kako izgleda?</i> Polish <b>jak</b> means "how" (Serbian <i>jak</i> = strong). <b>mieć na sobie</b> = <i>imati na sebi</i>.</p>`,
  9: `<p>Polish must choose: <b>iść</b> (on foot) or <b>jechać</b> (by vehicle); Serbian <i>ići</i> covers both. And "to a place" is <b>do</b> + genitive, where Serbian uses <i>u</i> + accusative: <i>idem u školu</i> → <b>idę do szkoły</b>, <i>idem kod lekara</i> → <b>idę do lekarza</b>.</p>`,
  26: `<p>A ticket is <b>bilet</b>; Polish <b>karta</b> is a (bank) card or a map. A train is <b>pociąg</b> (<i>voz</i>), a station <b>dworzec</b> (<i>stanica</i>), a platform <b>peron</b>.</p>`,
  10: `<p><b>Ile to kosztuje?</b> = <i>Koliko to košta?</i> Prices follow the same 1 / 2–4 / 5+ pattern as <i>dinar, dinara, dinara</i>: <b>złoty, złote, złotych</b>.</p>`,
  11: `<p>The past tense uses endings glued to the verb instead of <i>sam / si</i>: <i>bio sam</i> → <b>byłem</b>, <i>bila si</i> → <b>byłaś</b>. Never add <i>jestem</i>. Gender works as in Serbian: <b>byłem / byłam</b>, <b>byli / były</b>.</p>`,
  12: `<p>Serbian says <i>Ja sam lekar</i> (nominative); Polish needs the <b>instrumental</b> after być + noun: <b>Jestem lekarzem / nauczycielką</b>. "With" is instrumental in both: <i>sa bratom</i> → <b>z bratem</b>. Endings: <i>-om</i> → <b>-em / -ą</b>.</p>`,
  25: `<p>Location words take the instrumental as in Serbian: <b>nad, pod, przed, za, między</b> = <i>nad, pod, pred, za, između</i>. <b>Na stole</b> = <i>na stolu</i>. A room is <b>pokój</b> (<i>soba</i>).</p>`,
  13: `<p>Polish uses a plain <b>infinitive</b> after these verbs, never a <i>da</i> clause: <i>Hoću da idem</i> → <b>Chcę iść</b>, <i>Moram da radim</i> → <b>Muszę pracować</b>. <b>chcę</b> never makes a future (Serbian <i>hoću</i> / <i>-ću</i> does).</p>`,
  27: `<p><b>Boli mnie głowa</b> = <i>Boli me glava</i>, an exact match. The doctor: going is <b>do lekarza</b>, being there is <b>u lekarza</b> (Serbian <i>kod lekara</i> for both). Never <i>jestem do lekarza</i>.</p>`,
  14: `<p>With 2, 3, 4 Polish uses the ordinary <b>plural</b>: <b>dwa koty</b>, <b>trzy książki</b>. Serbian uses a special form there (<i>dve mačke, dva psa</i>). From 5: genitive plural in both: <b>pięć kotów</b> = <i>pet mačaka</i>.</p>`,
  15: `<p><b>się</b> = <i>se</i>: <b>Nazywam się</b> = <i>Zovem se</i>. It is less strict about position than <i>se</i>, but the usual place is after the verb: <b>Myję się</b>, <b>Jak się masz?</b></p>`,
  16: `<p>No <i>-ću</i> in Polish. Imperfective future: <b>będę + infinitive</b> (<b>będę pracować</b> = <i>radiću</i>). Perfective verbs make the future with present endings: <b>zrobię</b> = <i>uradiću</i>, <b>pojadę</b> = <i>otputovaću</i>.</p>`,
  28: `<p>Serbian <i>da</i> splits into three Polish words: <b>że</b> for "that" (<i>Mislim da…</i> → <b>Myślę, że…</b>), <b>żeby</b> for "in order to / so that" (<b>…, żeby pracować</b>), and nothing before an infinitive (<b>Chcę iść</b>). <b>bo</b> = <i>jer</i>, <b>więc</b> = <i>pa, dakle</i>, <b>ale</b> = <i>ali</i>.</p>`,
  17: `<p>Aspect is the same system as Serbian, and many pairs look alike: <b>pisać / napisać</b> = <i>pisati / napisati</i>, <b>robić / zrobić</b> = <i>raditi / uraditi</i>. One difference: a perfective present is a normal future on its own: <b>Zrobię to jutro</b> (<i>Uradiću to sutra</i>).</p>`,
  29: `<p>The conditional is glued together: <b>chciał-by-m</b> = <i>hteo bih</i>. Polite requests again use pan / pani + 3rd person: <b>Czy mógłby mi pan pomóc?</b> (<i>Da li biste mogli da mi pomognete?</i>).</p>`,
  18: `<p>The dative is used as in Serbian, and the short pronouns are nearly the same: <b>mi, ci, mu, jej, nam, wam, im</b> (<i>joj</i> → <b>jej</b>). <b>Daj mi to!</b> is identical. <b>Dziękuję ci / panu</b> = <i>hvala ti / vam</i>.</p>`,
  30: `<p>Like <i>bili / bile</i>, Polish splits the plural, but by <b>men</b>, not by masculine gender: <b>byli</b> only for groups with a man, <b>były</b> for everything else, including masculine things: <b>Stoły były nowe</b>.</p>
<p>Polish has a vocative too: <b>Marku! Aniu! Panie doktorze!</b> (<i>Marko! Anja! Doktore!</i>).</p>`,
  19: `<p>Imperative endings: <i>-te</i> → <b>-cie</b>: <i>čitajte</i> → <b>czytajcie</b>. To a stranger don't use a bare command: say <b>Proszę</b> + infinitive: <b>Proszę usiąść</b> (<i>Izvolite, sedite</i>).</p>`,
  31: `<p><b>Halo?</b> as in Serbian; <i>Ovde Marko</i> → <b>Tu Marko</b>. <b>Zapraszam</b> = <i>pozivam</i>. Purpose "da" is <b>żeby</b>: <b>Dzwonię, żeby zapytać…</b></p>`,
  32: `<p><b>Od kiedy? Do kiedy? Na jak długo?</b> = <i>Od kada? Do kada? Na koliko dugo?</i> PESEL is the Polish <i>JMBG</i>, and <b>meldunek</b> is <i>prijava boravka</i>. An office is <b>urząd</b>.</p>`,
  20: `<p><b>naj-</b> is the same as <i>naj-</i>: <b>najlepszy</b> = <i>najbolji</i>. The comparative ends in <b>-szy</b> where Serbian has <i>-ji</i>: <i>bolji</i> → <b>lepszy</b>, <i>veći</i> → <b>większy</b>. "Than" is <b>niż</b> (<i>nego / od</i>).</p>`,
  33: `<p>"Ago" comes <b>after</b> the time: <i>pre dve godine</i> → <b>dwa lata temu</b>. "For a week" is <b>przez tydzień</b> or just <b>tydzień</b> (<i>nedelju dana</i>). Double negation works as in Serbian: <b>Nigdy nie byłem</b> = <i>Nikad nisam bio</i>.</p>`
};

<li>feminine: genitive, dative and locative <b>-ej</b>, accusative and instrumental <b>-ą</b>: <b>w małej wsi, z młodszą siostrą</b></li></ul>
<p>Two traps: the feminine accusative of <b>ta</b> is <b>tę</b> (<b>Poproszę tę kawę</b>), but its instrumental is <b>tą</b>. And a masculine adjective in the accusative is like the genitive for <b>people and animals</b> (<b>Mam starszego brata, dużego psa</b>) but stays the same for things (<b>Mam nowy telefon</b>).</p>
<p><b>jeden</b> agrees with the noun: <b>jeden bilet, jedna kawa, jedno piwo</b>, and declines like <b>ten</b>: <b>jednego, jednej, jedną, jednym</b>.</p>`,

<ul><li>statements: <b>że</b> — Marek: „Jestem zmęczony.” → <b>Marek mówi, że jest zmęczony.</b></li>
<li>yes / no questions: <b>czy</b> — „Masz czas?” → <b>Pyta, czy mam czas.</b></li>
<li>other questions keep their question word — „Gdzie mieszkasz?” → <b>Pyta, gdzie mieszkam.</b></li>
<li>requests: <b>żeby</b> + past form — „Zadzwoń jutro!” → <b>Prosi, żebym zadzwonił / zadzwoniła jutro.</b></li></ul>
<p>Unlike English, the tense doesn't shift back: <b>Powiedział, że jest zmęczony</b> = He said he <i>was</i> tired.</p>
<p>Topics take <b>o</b> + locative: <b>artykuł o polityce</b>, <b>program o zwierzętach</b>. Where: <b>w radiu, w telewizji, w gazecie, w internecie</b>.</p>`,

const SR_NOTES_2 = {
  34: `<p>Plural endings are close to Serbian: <i>-ima / -ama</i> → <b>-ami</b> (<i>sa prijateljima</i> → <b>z przyjaciółmi</b>), and the locative <i>u prodavnicama</i> → <b>w sklepach</b>. The big difference is the dative: Serbian uses the same <i>-ima</i>, Polish has its own <b>-om</b>: <b>dzieciom, rodzicom</b>.</p>`,
  35: `<p>Adjective endings map neatly onto Serbian long forms: <i>-og</i> → <b>-ego</b> (<i>starijeg brata</i> → <b>starszego brata</b>), <i>-om</i> → <b>-ym / -ej</b> (<i>u velikom gradu</i> → <b>w dużym mieście</b>, <i>u maloj kući</i> → <b>w małym domu</b>). Watch the feminine accusative of "this": <b>tę</b>, not <i>tu</i>.</p>`,
  36: `<p><b>który</b> = <i>koji</i>, and it declines the same way: <i>firma u kojoj radim</i> → <b>firma, w której pracuję</b>. Polish always puts a comma before it. Use <b>który</b>, not <b>co</b>, in writing: <b>człowiek, który…</b></p>`,
  37: `<p>Serbian puts the same prefixes on <i>ići</i>: <i>ući, izaći, doći, otići, proći</i>. Polish also splits them by walking or riding: <b>wejść / wjechać</b>, <b>wyjść / wyjechać</b>. Map the prefixes: <i>u-</i> → <b>w-</b>, <i>iz-</i> → <b>wy-</b>, <i>do-</i> (come) → <b>przy-</b>. Polish <b>dojść</b> means to <b>reach</b> a place.</p>`,
  38: `<p>Reporting works as in Serbian: <i>Kaže da je umoran</i> → <b>Mówi, że jest zmęczony</b>, and the tense doesn't shift. But Serbian <i>da</i> becomes <b>że</b> for statements, <b>czy</b> for yes / no questions (<i>pita da li…</i> → <b>pyta, czy…</b>) and <b>żeby</b> for requests (<i>moli da dođem</i> → <b>prosi, żebym przyszedł</b>).</p>`,
  39: `<p><b>powinieneś</b> = <i>trebalo bi da…</i>, but Polish uses a personal form + infinitive: <i>Treba da spavaš više</i> → <b>Powinieneś więcej spać</b>. Comparative adverbs end in <b>-iej / -ej</b> where Serbian has <i>-ije / -e</i>: <i>zdravije</i> → <b>zdrowiej</b>, <i>češće</i> → <b>częściej</b>, <i>duže</i> → <b>dłużej</b>.</p>`,
  40: `<p>Serbian <i>da</i> + present (<i>Hoću da mi pomogneš</i>) becomes <b>żeby</b> + past form: <b>Chcę, żebyś mi pomógł</b>. The person ending goes on <b>żeby</b>: <b>żebym, żebyś</b>. Same person? Use the infinitive: <b>Chcę oddać buty</b>.</p>`,
  41: `<p><b>jeśli</b> = <i>ako</i>; <b>gdyby</b> = <i>kad bi / ako bi</i>: <i>Kad bih imao vremena, išao bih</i> → <b>Gdybym miał czas, poszedłbym</b>. The endings go on <b>gdyby</b> (gdyby<b>m</b>, gdyby<b>ś</b>), as on żeby. False friend: <b>liść</b> is a leaf; a Polish <b>list</b> is a letter.</p>`,
  42: `<p>Storytelling works like Serbian: imperfective for the scene (<i>padala je kiša</i> → <b>padał deszcz</b>), perfective for events (<i>odjednom sam primetio</i> → <b>nagle zauważyłem</b>). Polish has no aorist or pluperfect in everyday speech: one past tense does it all. <b>Okazało się, że…</b> = <i>ispostavilo se da…</i></p>`,
  43: `<p>As in Serbian, only the last number of a year is an ordinal: <i>1989. godine</i> → <b>w 1989 roku</b>. Polish adds the preposition <b>w</b> + locative, where Serbian uses the genitive alone. Centuries: <i>u XIX veku</i> → <b>w XIX wieku</b>.</p>`,
  44: `<p>Watch the cases: Serbian <i>učim srpski</i> uses the accusative, but Polish <b>uczyć się</b> takes the genitive: <b>uczę się polskiego</b>. <i>interesovati se za</i> + accusative → <b>interesować się</b> + instrumental: <b>historią</b>. Polish school marks go <b>1–6</b>, with 6 the best; Serbian schools use 1–5.</p>`,
  45: `<p><b>ktoś, kto</b> = <i>neko ko</i>; <b>coś, czym</b> = <i>nešto čime</i>: <i>nešto čime se otvara vino</i> → <b>coś, czym się otwiera wino</b>. Careful with <b>uważny</b> (careful, attentive) — it has nothing to do with <i>uvažavati</i> (to respect).</p>`
};

  9: `<h4>Where to? or where? (dokąd? / gdzie?)</h4>
<p>Some prepositions take one case for <b>movement</b> and another for <b>location</b>. The question tells you which:</p>
<ul><li><b>na</b>: dokąd? + accusative (<b>Idę na pocztę, na koncert</b>) · gdzie? + locative (<b>Jestem na poczcie, na koncercie</b>)</li>
<li><b>w</b>: dokąd? + accusative for mountains and some regions (<b>Jadę w góry</b>) · gdzie? + locative (<b>Jestem w górach</b>)</li>
<li><b>nad, pod, za</b>: dokąd? + accusative (<b>Jedziemy nad morze, za granicę</b>) · gdzie? + instrumental (<b>Jesteśmy nad morzem, za granicą</b>)</li></ul>
<p>Places you go <b>do</b> (do sklepu, do domu) are places you are <b>w</b> (w sklepie, w domu). People: <b>do lekarza</b> (going) → <b>u lekarza</b> (being there).</p>`,
  3: `<h4>Verbs with na, o, za + accusative</h4>
<p>Some verbs always take a preposition, followed by the accusative: <b>czekać na</b> (wait for): <b>Czekam na autobus</b>; <b>patrzeć na</b> (look at); <b>pytać o</b> (ask about): <b>Pytam o drogę</b>; <b>prosić o</b> (ask for): <b>Proszę o rachunek</b>; <b>płacić za</b> (pay for), <b>dziękować za</b> (thank for): <b>Dziękuję za kawę</b>.</p>`,
  5: `<h4>Talking about, walking around: o and po + locative</h4>

/* ================================================================
   FLASHCARDS view
   ================================================================ */
/* Word list sorting: Polish alphabetical order (ą after a, ł after l…) or course

const PL_COLLATOR = new Intl.Collator("pl", { sensitivity: "base" });
const PL_ALPHABET = "AĄBCĆDEĘFGHIJKLŁMNŃOÓPQRSŚTUVWXYZŹŻ".split("");

   A course word keeps its lesson card id (unit-index). Any other word becomes

   Cards you add yourself carry x: 1, so they don't use up a lesson's new words.
   If a lesson teaches a word you added (now, or in a later content update),

  COURSE.forEach(u => u.vocab.forEach((v, i) => {
    [v[0], ...String(v[0]).split(" / ")].forEach(f => { const k = dictKey(f); if (k && !m.has(k)) m.set(k, u.id + "-" + i); });
  }));

}

    const a = srs.cards[id], b = srs.cards[cid];
    if (a && (!b || (a.t || 0) > (b.t || 0))) srs.cards[cid] = a;

function isMine(c) {

}

    .replace(/^impf$/, "imperfective").replace(/^pf$/, "perfective")
    .replace(/\+([GDAIL])(?:\/\+([GDAIL]))?/, (_, a, b) => "+ " + CASE_ABBR[a] + (b ? " / " + CASE_ABBR[b] : ""));

  COURSE.forEach(u => u.vocab.forEach((v, i) => {
    const k = dictKey(v[0]);
    if (byKey.has(k)) return;  /* a word taught twice: keep its first lesson */
    const e = { pl: v[0], en: v[1], note: v[2] || "", g: "", id: u.id + "-" + i, unit: u.id };
    byKey.set(k, e); byId.set(e.id, e); out.push(e);
  }));
  for (const line of DICT_RAW.split("\n")) {
    const [pl, en, g = ""] = line.split("|");
    if (!pl || !en) continue;
    const k = dictKey(pl), cid = courseIndex().get(k);
    const hit = byKey.get(k) || (cid && byId.get(cid));

      if (!hit.id && !hit.en.split("; ").includes(en)) hit.en += "; " + en;

function renderPlacement() {
  const host = h("div");
  const P = S.progress;
  app.replaceChildren(h("div", { class: "stack-lg" },
    h("div", { class: "session-head" }, h("button", { class: "btn ghost sm", onclick: () => setView("course") }, "← Course")),
    h("div", { class: "stack" }, h("span", { class: "eyebrow" }, "Test poziomujący · placement test"), h("h1", { class: "pl" }, "Gdzie zacząć?"),
      h("p", { class: "muted" }, "About 18 questions from across the course. Each round jumps up or down depending on how you did, to find the first unit you don't know yet. Nothing changes in your course unless you choose to skip ahead at the end.")),
    host));
  host.append(h("button", { class: "btn primary", onclick: run }, "Start the placement test"));
  async function run() {
    inSession = true;
    let lo = 0, hi = COURSE.length - 1, pos = Math.min(12, hi), best = -1, n = 0, rounds = 0;
    while (lo <= hi && rounds < 6) {
      const u = COURSE[pos]; rounds++;
      const items = shuffle(pick(u.quiz.filter(q => !q.sr), 2).concat(vocabItems(u, 1)));
      let ok = 0;
      for (const it of items) { n++; const r = await exercise(host, it, { counter: `Question ${n}`, label: "level check" }); if (r.correct) ok++; }
      if (ok >= 2) { best = Math.max(best, pos); lo = pos + 1; } else hi = pos - 1;
      pos = Math.floor((lo + hi) / 2);
    }
    keyHandler = null; inSession = false;
    const start = Math.min(best + 1, COURSE.length - 1), su = COURSE[start];
    const ahead = start > POS[P.unit] && !courseDone();
    P.placement = { d: localKey(), unit: su.id }; persist("progress");
    const go = h("button", { class: "btn primary" }, `Skip ahead to unit ${start + 1}`);
    go.onclick = () => {
      if (!go.dataset.sure) { go.dataset.sure = "1"; go.textContent = `Tap again: mark units 1–${start} as done`; return; }
      COURSE.slice(0, start).forEach(x => { if (!P.mastered.includes(x.id)) { P.mastered.push(x.id); P.masteredAt[x.id] = localKey(); } });
      P.unit = su.id; persist("progress"); checkMilestones(); setView("today");

      h("h2", null, best < 0 ? "Start at the beginning" : `Suggested start: unit ${start + 1}`),
      h("p", null, best < 0 ? "Unit 1 is the right place to start." : `You seem comfortable up to unit ${best + 1}, „${COURSE[best].pl}”. The next one is „${su.pl}” (${su.en}).`),
      h("p", { class: "small muted" }, ahead ? "Skipping ahead marks the earlier units as finished. Their words still join your flashcards over the coming days." : "You're already at or past this point in the course, so nothing needs to change."),
      h("div", { class: "row" }, ahead ? go : null, h("button", { class: "btn ghost", onclick: () => setView("course") }, "Back to the course"))));
  }

    h("div", { class: "spread" }, h("h3", null, "Co już umiesz · what you can do now"), h("span", { class: "chip green" }, `${done.length} / ${UNITS.length} units`)),
    done.length ? h("ul", { class: "cando" }, done.flatMap(u => CAN_DO[u.id].map(t => h("li", null, t)))) : h("p", { class: "small muted" }, "Finish your first unit and the things you can now do in Polish will be listed here."),
    !courseDone() ? h("p", { class: "small muted" }, `Next, in unit ${unitNo(curUnit())}: `, CAN_DO[curUnit().id].join("; "), ".") : null);
}
function milestonesPanel() {
  const P = S.progress, got = P.milestones || {};
  return h("section", { class: "card stack" },
    h("div", { class: "spread" }, h("h3", null, "Osiągnięcia · milestones"), h("span", { class: "chip" }, `${Object.keys(got).length} / ${MILESTONES.length}`)),
    h("div", { class: "badges" }, MILESTONES.map(m => h("div", { class: "badge" + (got[m.id] ? " on" : ""), title: got[m.id] ? `Earned ${got[m.id]}` : "Not yet" },
      h("span", { class: "badge-icon" }, m.icon), h("b", { class: "pl" }, m.pl), h("small", null, m.en)))));
}
function updateBadge() {
  if (!IS_APP || !navigator.setAppBadge) return;
  try { const n = dueCards().length; (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {}); } catch (e) {}
}

/* ================================================================
   PROGRESS view
   ================================================================ */
function renderProgress() {
  const P = S.progress;
  const intro = introduced();
  const learned = intro.filter(c => S.srs.cards[c.id].b >= 3).length;
  const qs = P.quizzes.slice(-14);
  const bars = h("div", { class: "bars", role: "img", "aria-label": "Daily test scores" });
  bars.append(h("div", { class: "pass-line", style: "bottom:80%" }));
  qs.forEach(q => { const pct = Math.round(q.s / q.t * 100); bars.append(h("div", { class: "b" + (pct >= 80 ? " pass" : ""), style: `height:${Math.max(pct, 3)}%`, title: `${q.d} · Unit ${unitNo(q.u)} · ${q.s}/${q.t}` }, h("span", null, pct + ""))); });
  const heat = h("div", { class: "heat", role: "img", "aria-label": "Study days in the last 4 weeks" });
  const now = new Date();
  const start = new Date(now); start.setDate(now.getDate() - 27);
  for (let i = 0; i < 28; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const rec = P.days[localKey(d)];
    const n = rec ? Object.keys(rec.steps || {}).length : 0;
    heat.append(h("i", { class: (n >= 5 ? "l2" : n ? "l1" : "") + (i === 27 ? " today" : ""), title: `${d.getDate()} ${PL_MONTHS[d.getMonth()]}: ${n} steps` }));
  }
  const weak = weakList();
  const maxW = Math.max(3, ...weak.map(w => w[1]));
  app.replaceChildren(h("div", { class: "stack-lg" },
    h("div", { class: "stack" }, h("span", { class: "eyebrow" }, "Your progress"), h("h1", { class: "pl" }, "Postępy")),
    syncPanel(),
    timePanel(),
    canDoPanel(),
    milestonesPanel(),
    h("div", { class: "tiles" },
      stat(String(P.streak || 0), "day streak", `best ${P.best || 0} · ❄ ${P.freezes || 0} freeze${(P.freezes || 0) === 1 ? "" : "s"}`),
      stat(String(P.mastered.length) + " / " + UNITS.length, "units finished", levelLabel()),
      stat(String(learned), "words learned", `${intro.length} started`),
      stat(String(P.xp || 0), "XP", `${todayRec().xp} today`)),
    h("section", { class: "card stack" }, h("div", { class: "spread" }, h("h3", null, "Daily test scores"), h("span", { class: "small muted" }, "dashed line = 80% pass mark")),
      qs.length ? bars : h("p", { class: "muted small" }, "Your scores will appear here after your first daily test.")),
    h("section", { class: "card stack" }, h("h3", null, "Last 4 weeks"), heat, h("p", { class: "small muted" }, "Light green: studied that day. Dark green: finished 5 or more steps.")),
    h("section", { class: "card stack" }, h("h3", null, "Weak spots"),
      weak.length ? h("div", { class: "stack" }, weak.map(([t, v]) => h("div", { class: "hbar" }, h("span", null, tagLabel(t)), h("div", { class: "track" }, h("span", { style: `width:${Math.min(100, v / maxW * 100)}%` })), h("span", { class: "num small muted" }, "×" + Math.round(v)))))
        : h("p", { class: "muted small" }, "No weak spots yet. Mistakes in tests, conversations and writing will show up here and shrink as you get them right.")),
    settingsPanel(),
    h("section", { class: "stack" }, h("h3", null, "Reset"), resetBox())
  ));
}
function stat(v, label, sub) { return h("div", { class: "tile-stat" }, h("div", { class: "v" }, v), h("div", { class: "small" }, label), h("div", { class: "small muted" }, sub)); }
function resetBox() {
  const wrap = h("div", { class: "row" });
  const ask = () => wrap.replaceChildren(h("div", { class: "confirm stack" }, h("p", null, "This erases your streak, XP, unit progress and flashcard memory. It can't be undone."),
    h("div", { class: "row" }, h("button", { class: "btn primary sm", onclick: () => { const ep = Date.now(); S.progress = Object.assign(DEFAULT_PROGRESS(), { epoch: ep }); S.srs = Object.assign(DEFAULT_SRS(), { epoch: ep }); try { localStorage.removeItem("pc.pack"); } catch (e) {} saveAll(); setView("today"); } }, "Erase everything"), h("button", { class: "btn ghost sm", onclick: () => renderProgress() }, "Cancel"))));
  wrap.append(h("button", { class: "btn ghost sm", onclick: ask }, "Reset all progress"));
  return wrap;
}

/* ================================================================
   Boot
   ================================================================ */
readLocal();
advanceIfDone();
todayRec();
if (!S.progress.milestones || !Object.keys(S.progress.milestones).length) { const P = S.progress; P.milestones = {}; P.stats = P.stats || {}; const L = { learned: learnedCount() }; MILESTONES.forEach(m => { if (m.check(P, L)) P.milestones[m.id] = localKey(); }); }
S.progress.streak = computeStreak(S.progress);
applyFreezes();
setView("today");

/* A sync link puts the code after # (e.g. …/artifact/ID#s1.xxxx). Import it once. */
async function takeIncomingLink() {
  const hash = (location.hash || "").slice(1);
  if (!/^s[01]\./.test(hash)) return;
  const key = hash.length + ":" + hash.slice(-32);
  try { if (localStorage.getItem("pc.lastImport") === key) return; } catch (e) {}
  try {
    const r = applySync(await decodeSync(hash));
    syncBanner = { ok: true, msg: r.msg };
    try { localStorage.setItem("pc.lastImport", key); } catch (e) {}
  } catch (e) { syncBanner = { ok: false, msg: e.message || "The sync link couldn't be read. Try copying the code instead." }; }
  try { if (IS_APP) history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
}

(async () => {
  const cl = window.claude;
  if (!cl || typeof cl.use !== "function") {
    aiChecked = true;
    if (IS_APP) {
      await takeIncomingLink(); advanceIfDone(); todayRec();
      try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
      window.addEventListener("hashchange", async () => { await takeIncomingLink(); if (!inSession) render(); });
    }
    if (!inSession) render(); return;
  }
  syncState = "loading"; renderStats();
  const [dbNs, sampleNs] = await Promise.all([cl.use("db").catch(() => null), cl.use("sample").catch(() => null)]);
  sample = sampleNs || null; aiChecked = true;
  db = dbNs || null;
  if (db) {
    try {
      const [p, s] = await withTimeout(Promise.all([db.doc("app/progress").get(), db.doc("app/srs").get()]), 20000);
      const hadLocal = { progress: S.progress.xp > 0 || S.progress.mastered.length > 0, srs: Object.keys(S.srs.cards).length > 0 };
      [["progress", p], ["srs", s]].forEach(([key, snap]) => {
        const remote = snap.exists ? snap.data() : null;
        if (!remote) { if (hadLocal[key] || pending[key]) { pending[key] = true; flush(key); } return; }
        const merged = key === "progress" ? mergeProgress(S[key], remote) : mergeSrs(S[key], remote);
        S[key] = merged; writeLocal(key);
        const same = key === "progress"
          ? merged.xp === normalizeProgress(clone(remote)).xp && merged.mastered.length === (remote.mastered || []).length && merged.quizzes.length === (remote.quizzes || []).length && JSON.stringify(merged.writings) === JSON.stringify(remote.writings || []) && (merged.epoch || 0) === (remote.epoch || 0)
          : Object.keys(merged.cards).length === Object.keys(remote.cards || {}).length && Object.entries(merged.cards).every(([id, c]) => remote.cards[id] && (remote.cards[id].t || 0) === (c.t || 0)) && (merged.epoch || 0) === (remote.epoch || 0);
        if (!same) { pending[key] = true; flush(key); } else pending[key] = false;
      });
      savePending();
      syncState = "synced";
    } catch (e) { syncState = online() ? "error" : "offline"; }
  } else syncState = "local";
  await takeIncomingLink();
  advanceIfDone();
  todayRec();
  S.progress.streak = computeStreak(S.progress);
  applyFreezes();
  if (!inSession) render(); else renderStats();
})();
</script>
